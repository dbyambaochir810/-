services:
  - type: web
    name: aztan-sugalaa
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: aztan-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/aztan.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
